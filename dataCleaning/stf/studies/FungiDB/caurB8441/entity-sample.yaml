name: sample
description: Sequenced isolates aligned to the caurB8441 reference genome, across
  all dnaseq experiments.
display_name: Sample
display_name_plural: Samples
stable_id: sample

id_columns:
  - id_column: sample_id
    entity_name: sample
    provider_label:
      - sample_id

variables:
  - variable: dataset_id
    provider_label:
      - dataset_id
    display_name: Dataset
    definition: 'Dataset (RSRC) this sample came from, as the DS_ presenter id: "DS_"
      + first 10 hex chars of sha1(datasetName), matching DatasetPresenter.getId().
      Hashed from the NEW dnaseq workflow dataset name.'
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: sample_display_name
    provider_label:
      - sample_display_name
    display_name: Sample name
    definition: Preferred human-readable sample name. sample_id is kept byte-identical
      to what the dnaseq workflow emitted so it joins to the alignment stats; where
      the harmonized ApiCommonMetadataRepository name differs, that curated name is
      shown here instead.
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: age
    provider_label:
      - age
    display_name: age
    definition: age (OBI_0001169)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: alternative_sample_id
    provider_label:
      - alternative_sample_id
    display_name: alternative sample ID
    definition: alternative sample ID (OBI_0001901)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation
  - variable: amb
    provider_label:
      - amb
    display_name: AmB
    definition: AmB (CHEBI_2682)
    data_type: string
    data_shape: categorical
    parent_variable: phenotype_and_drug_response
  - variable: and
    provider_label:
      - and
    display_name: AND
    definition: AND (CHEBI_55346)
    data_type: string
    data_shape: categorical
    parent_variable: phenotype_and_drug_response
  - variable: anti_fungal_agent_resistance
    provider_label:
      - anti_fungal_agent_resistance
    display_name: Anti-fungal agent resistance
    definition: Anti-fungal agent resistance (OMP_0000274)
    data_type: string
    data_shape: categorical
    parent_variable: phenotype_and_drug_response
  - variable: collection_date
    provider_label:
