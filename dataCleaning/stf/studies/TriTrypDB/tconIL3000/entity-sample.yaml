name: sample
description: Sequenced isolates aligned to the tconIL3000 reference genome, across
  all dnaseq experiments.
display_name: Sample
display_name_plural: Samples
stable_id: sample

id_columns:
  - id_column: sample_id
    entity_name: sample
    provider_label:
      - sample_id

variables:
  - variable: dataset_id
    provider_label:
      - dataset_id
    display_name: Dataset
    definition: 'Dataset (RSRC) this sample came from, as the DS_ presenter id: "DS_"
      + first 10 hex chars of sha1(datasetName), matching DatasetPresenter.getId().
      Hashed from the NEW dnaseq workflow dataset name.'
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: sample_display_name
    provider_label:
      - sample_display_name
    display_name: Sample name
    definition: Preferred human-readable sample name. sample_id is kept byte-identical
      to what the dnaseq workflow emitted so it joins to the alignment stats; where
      the harmonized ApiCommonMetadataRepository name differs, that curated name is
      shown here instead.
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: collection_date_original
    provider_label:
      - collection_date_original
    display_name: Collection date as provided
    definition: Verbatim collection date string from the data provider, retained because
      the typed collection_date is null whenever the value is incomplete or ambiguous.
    data_type: integer
    data_shape: continuous
    parent_variable: collection_event
  - variable: collection_year
    provider_label:
      - collection_year
    display_name: Collection Year
    definition: Collection Year (EUPATH_0000753)
    data_type: integer
    data_shape: continuous
    parent_variable: collection_event
  - variable: country
    provider_label:
      - country
    display_name: country
    definition: country (ENVO_00000009)
    data_type: string
    data_shape: categorical
    parent_variable: collection_location
  - variable: parasite_organism
    provider_label:
      - parasite_organism
    display_name: parasite organism
    definition: parasite organism (OPL_0000232)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation
  - variable: parasite_strain
    provider_label:
      - parasite_strain
    display_name: parasite strain
    definition: parasite strain (EUPATH_0000761)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation

categories:
  - category: collection_event
    display_name: Collection event
    data_type: category
    has_values: no
  - category: collection_location
    display_name: Collection location
    data_type: category
    has_values: no
  - category: organism_under_investigation
    display_name: Organism under investigation
    data_type: category
    has_values: no
  - category: provenance
    display_name: Provenance and identity
    data_type: category
    has_values: no

collections: []

