name: sample
description: Sequenced isolates aligned to the pvivP01 reference genome, across all
  dnaseq experiments.
display_name: Sample
display_name_plural: Samples
stable_id: sample

id_columns:
  - id_column: sample_id
    entity_name: sample
    provider_label:
      - sample_id

variables:
  - variable: dataset_id
    provider_label:
      - dataset_id
    display_name: Dataset
    definition: 'Dataset (RSRC) this sample came from, as the DS_ presenter id: "DS_"
      + first 10 hex chars of sha1(datasetName), matching DatasetPresenter.getId().
      Hashed from the NEW dnaseq workflow dataset name.'
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: sample_display_name
    provider_label:
      - sample_display_name
    display_name: Sample name
    definition: Preferred human-readable sample name. sample_id is kept byte-identical
      to what the dnaseq workflow emitted so it joins to the alignment stats; where
      the harmonized ApiCommonMetadataRepository name differs, that curated name is
      shown here instead.
    data_type: string
    data_shape: categorical
    parent_variable: provenance
  - variable: age
    provider_label:
      - age
    display_name: age
    definition: age (OBI_0001169)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: body_temperature
    provider_label:
      - body_temperature
    display_name: body_temperature
    definition: body_temperature (OBI_0003073)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: collection_date
    provider_label:
      - collection_date
    display_name: Collection date
    definition: Collection date (OBI_0001619)
    data_type: date
    data_shape: continuous
    parent_variable: collection_event
  - variable: collection_date_original
    provider_label:
      - collection_date_original
    display_name: Collection date as provided
    definition: Verbatim collection date string from the data provider, retained because
      the typed collection_date is null whenever the value is incomplete or ambiguous.
    data_type: string
    data_shape: categorical
    parent_variable: collection_event
  - variable: collection_month
    provider_label:
      - collection_month
    display_name: Collection month
    definition: Month of specimen collection (1-12) where known.
    data_type: integer
    data_shape: continuous
    parent_variable: collection_event
  - variable: collection_year
    provider_label:
      - collection_year
    display_name: Collection Year
    definition: Collection Year (EUPATH_0000753)
    data_type: integer
    data_shape: continuous
    parent_variable: collection_event
  - variable: country
    provider_label:
      - country
    display_name: country
    definition: country (ENVO_00000009)
    data_type: string
    data_shape: categorical
    parent_variable: collection_location
  - variable: geographic_location
    provider_label:
      - geographic_location
    display_name: Geographic location
    definition: Named place of collection below country/state level - city, district,
      locality or region.
    data_type: string
    data_shape: categorical
    parent_variable: collection_location
  - variable: health_status
    provider_label:
      - health_status
    display_name: health_status
    definition: health_status (OGMS_0000123)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: host_common_name
    provider_label:
      - host_common_name
    display_name: host_common_name
    definition: host_common_name (OBI_0003074)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: lab_host
    provider_label:
      - lab_host
    display_name: lab host
    definition: lab host (EUPATH_0000499)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: latitude_coordinate_measurement_datum
    provider_label:
      - latitude_coordinate_measurement_datum
    display_name: latitude coordinate measurement datum
    definition: latitude coordinate measurement datum (OBI_0001620)
    data_type: string
    data_shape: categorical
    parent_variable: collection_location
  - variable: longitude_coordinate_measurement_datum
    provider_label:
      - longitude_coordinate_measurement_datum
    display_name: longitude coordinate measurement datum
    definition: longitude coordinate measurement datum (OBI_0001621)
    data_type: string
    data_shape: categorical
    parent_variable: collection_location
  - variable: organism
    provider_label:
      - organism
    display_name: organism
    definition: organism (OBI_0100026)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: organism_id
    provider_label:
      - organism_id
    display_name: Organism ID
    definition: Organism ID (OBI_0001141)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation
  - variable: parasite_density_by_microscope
    provider_label:
      - parasite_density_by_microscope
    display_name: parasite_density_by_microscope
    definition: parasite_density_by_microscope (EUPATH_0000537)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: parasite_organism
    provider_label:
      - parasite_organism
    display_name: parasite organism
    definition: parasite organism (OPL_0000232)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation
  - variable: parasite_strain
    provider_label:
      - parasite_strain
    display_name: parasite strain
    definition: parasite strain (EUPATH_0000761)
    data_type: string
    data_shape: categorical
    parent_variable: organism_under_investigation
  - variable: sex
    provider_label:
      - sex
    display_name: sex
    definition: sex (PATO_0000047)
    data_type: string
    data_shape: categorical
    parent_variable: host
  - variable: specimen
    provider_label:
      - specimen
    display_name: specimen
    definition: specimen (OBI_0100051)
    data_type: string
    data_shape: categorical
    parent_variable: specimen_and_culture
  - variable: specimen_collector
    provider_label:
      - specimen_collector
    display_name: specimen collector
    definition: specimen collector (OBI_0001895)
    data_type: string
    data_shape: categorical
    parent_variable: collection_event
  - variable: state
    provider_label:
      - state
    display_name: State or province
    definition: Sub-national administrative region of collection.
    data_type: string
    data_shape: categorical
    parent_variable: collection_location

categories:
  - category: collection_event
    display_name: Collection event
    data_type: category
    has_values: no
  - category: collection_location
    display_name: Collection location
    data_type: category
    has_values: no
  - category: host
    display_name: Host
    data_type: category
    has_values: no
  - category: organism_under_investigation
    display_name: Organism under investigation
    data_type: category
    has_values: no
  - category: provenance
    display_name: Provenance and identity
    data_type: category
    has_values: no
  - category: specimen_and_culture
    display_name: Specimen and culture
    data_type: category
    has_values: no

collections: []

